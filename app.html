<style>
/* ===== Liquid Glass ===== */
:root{
  --bg:#dde5f6;--ink:#0f1b3a;--mut:#56627f;--acc:#2f6bff;--ok:#12a150;--bad:#e11d48;
  --sur:rgba(255,255,255,.40);--sur2:rgba(255,255,255,.34);--line:rgba(110,130,185,.22);
  --glass-brd:rgba(255,255,255,.65);--glass-hi:rgba(255,255,255,.85);--glass-lo:rgba(255,255,255,.10);
  --glass-shadow:0 10px 34px -10px rgba(30,50,110,.28);
  --blur:blur(22px) saturate(180%);
  --b1:#7aa7ff;--b2:#ff9ad5;--b3:#7be3c6;--b4:#ffd480;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080d1c;--ink:#eaf0ff;--mut:#9aa6c6;--acc:#7c93ff;
  --sur:rgba(30,40,72,.46);--sur2:rgba(60,76,125,.38);--line:rgba(150,170,230,.18);
  --glass-brd:rgba(255,255,255,.16);--glass-hi:rgba(255,255,255,.28);--glass-lo:rgba(255,255,255,.04);
  --glass-shadow:0 12px 36px -12px rgba(0,0,0,.65);
  --b1:#2f4fd8;--b2:#a0266f;--b3:#12806a;--b4:#9a6a14}}
:root[data-theme="dark"]{
  --bg:#080d1c;--ink:#eaf0ff;--mut:#9aa6c6;--acc:#7c93ff;
  --sur:rgba(30,40,72,.46);--sur2:rgba(60,76,125,.38);--line:rgba(150,170,230,.18);
  --glass-brd:rgba(255,255,255,.16);--glass-hi:rgba(255,255,255,.28);--glass-lo:rgba(255,255,255,.04);
  --glass-shadow:0 12px 36px -12px rgba(0,0,0,.65);
  --b1:#2f4fd8;--b2:#a0266f;--b3:#12806a;--b4:#9a6a14}
html,body{height:100%}
html,body,button,input,select,.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,.tab,.row,.seg{-webkit-user-select:none;user-select:none}
input,select{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 30% at 18% 14%,var(--b1) 0,transparent 70%),
    radial-gradient(34% 28% at 86% 24%,var(--b2) 0,transparent 70%),
    radial-gradient(42% 34% at 72% 88%,var(--b3) 0,transparent 70%),
    radial-gradient(36% 30% at 8% 84%,var(--b4) 0,transparent 70%);
  filter:blur(26px);opacity:.85;animation:float 22s ease-in-out infinite alternate}
@keyframes float{to{transform:translate3d(3%,2%,0) scale(1.06)}}
.app{max-width:440px;margin:0 auto;padding:16px 16px 118px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:8px;font:700 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.02em}
.brand .ic{color:var(--acc)}
h2{font:700 24px/1.15 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.03em;margin:4px 0 14px}

/* иконки */
.ic{display:inline-block;flex:none;vertical-align:middle}

/* общий материал стекла */
.card,.seg,.tabs,.bal,.reel,#toast,.btn.g,input,select{
  background:var(--sur);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-brd);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-lo)}
.card{position:relative;border-radius:26px;padding:16px;margin-bottom:12px;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,var(--glass-hi) 0,transparent 38%,transparent 70%,var(--glass-lo) 100%);opacity:.45}
.card>*{position:relative}
/* цветное свечение карточки по редкости */
.card.glow::before{background:radial-gradient(70% 90% at 22% 40%,var(--rc),transparent 72%),linear-gradient(160deg,var(--glass-hi) 0,transparent 40%);opacity:.5}
.card.glow{box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi),0 0 0 1px color-mix(in srgb,var(--rc) 45%,transparent)}
.bal{display:flex;align-items:center;gap:7px;color:var(--ink);border-radius:99px;padding:8px 15px;font:700 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bal .ic{color:var(--acc)}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{flex:1;min-width:0}.row b{display:block;font-weight:700}
.row small,.mut{color:var(--mut);font-size:13px}
.mut .ic,.row.mut .ic{margin-right:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:linear-gradient(180deg,rgba(120,155,255,.98),rgba(47,107,255,.9));color:#fff;
  font:700 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:9px 14px;border-radius:14px;cursor:pointer;
  box-shadow:0 8px 20px -8px var(--acc),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.96);filter:brightness(1.08)}
.btn.g{color:var(--ink);background:var(--sur2)}
.btn:disabled{opacity:.4}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.seg{display:flex;border-radius:18px;padding:4px;margin-bottom:14px;gap:2px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;color:var(--mut);font:700 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:9px;border-radius:14px;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:linear-gradient(180deg,var(--glass-hi),var(--sur));color:var(--ink);
  box-shadow:0 2px 8px rgba(20,30,70,.18),inset 0 1px 0 var(--glass-hi)}

.tabs{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 24px));box-sizing:border-box;display:flex;gap:2px;border-radius:999px;padding:7px;z-index:4}
.tab{flex:1;border:0;background:none;color:var(--mut);font:700 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;gap:3px;justify-items:center;padding:7px 0;cursor:pointer;border-radius:999px;transition:background .2s,color .2s}
.tab.on{color:var(--acc);background:linear-gradient(180deg,var(--glass-hi),var(--sur2));box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 10px rgba(20,30,70,.18)}

/* картинки телефонов и аксессуаров (SVG или ваши фото из папки img) */
.pic{display:block;flex:none;position:relative}
.pic svg,.pic img{width:100%;height:100%;display:block;object-fit:contain}
.pic.big{width:96px;height:192px}
.pic.big svg,.pic.big img{filter:drop-shadow(0 16px 16px rgba(20,30,70,.38))}
.pic.mini{width:32px;height:64px}
.pic.rp{width:64px;height:128px;margin-right:16px}
.tag{display:inline-flex;align-items:center;gap:5px;font:700 11px system-ui,sans-serif;padding:3px 9px;border-radius:99px;background:var(--sur2);color:var(--ink);border:1px solid var(--glass-brd)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

.reel{position:relative;overflow:hidden;border-radius:28px;padding:14px 0;margin-bottom:14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.reel::after{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:82px;transform:translateX(-50%);border:2px solid var(--glass-hi);border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04));box-shadow:0 0 24px -4px var(--acc);pointer-events:none}
.strip{display:flex;width:max-content;animation:slide 30s linear infinite}
.reel.fast .strip{animation-duration:1.5s}
@keyframes slide{to{transform:translateX(-50%)}}
.btn.go{width:100%;padding:17px;font:700 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border-radius:20px;margin-bottom:12px;box-shadow:0 16px 30px -12px var(--acc),inset 0 1px 0 rgba(255,255,255,.6)}
.found{display:flex;gap:16px;align-items:center;animation:drop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes drop{from{transform:translateY(-24px) scale(.9);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.big{font:700 26px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.03em}
input,select{width:100%;box-sizing:border-box;color:var(--ink);border-radius:14px;padding:11px;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin-bottom:8px;box-shadow:inset 0 1px 3px rgba(20,30,70,.12)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ttl{display:flex;align-items:center;gap:8px;font-weight:700}
.ttl .ic{color:var(--acc)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);color:var(--ink);padding:10px 18px;border-radius:99px;font-weight:700;transition:transform .25s;z-index:5;max-width:90%}
#toast.on{transform:translate(-50%,0)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.ctl small{display:block;font:700 10px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.06em;color:var(--mut);margin:0 0 4px 6px}
.ctl .seg{margin:0;padding:3px}
.ctl .seg button{padding:7px 2px;font-size:12px;white-space:nowrap}
.cico{display:inline-block;vertical-align:-5px;margin-right:6px}
.av{position:relative;display:inline-grid;place-items:center;flex:none;border-radius:50%;overflow:hidden;color:#fff;font-weight:700;background:linear-gradient(135deg,#6f87ff,#ff8fd0);border:2px solid var(--glass-brd);box-shadow:0 6px 16px -6px rgba(30,50,110,.45)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#profbtn{padding:4px!important;border-radius:99px}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pack{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:13px 4px;border-radius:18px;border:1px solid var(--glass-brd);background:var(--sur2);color:var(--ink);cursor:pointer;font:inherit;box-shadow:inset 0 1px 0 var(--glass-hi)}
.pack b{display:flex;align-items:center;gap:4px;font:700 16px system-ui,sans-serif}
.pack small{color:var(--mut);font-size:12px}
.pack .bn{position:absolute;top:-8px;right:6px;font:700 10px system-ui,sans-serif;background:var(--acc);color:#fff;padding:2px 7px;border-radius:99px}
.pack:active{transform:scale(.96)}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--sur:rgba(255,255,255,.92);--sur2:#eef2fa}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sur:#171f36;--sur2:#1f2944}}
  :root[data-theme="dark"]{--sur:#171f36;--sur2:#1f2944}}
@media(prefers-reduced-transparency:reduce){
  .card,.seg,.tabs,.bal,.reel,#toast,.btn.g,input,select{-webkit-backdrop-filter:none;backdrop-filter:none}
  :root{--sur:rgba(255,255,255,.94);--sur2:#eef2fa}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sur:#171f36;--sur2:#1f2944}}
  :root[data-theme="dark"]{--sur:#171f36;--sur2:#1f2944}}
</style>

<script>
const P=__P__;const A=__A__;const CR=__C__;const IMG=__I__;
const ALL={};P.forEach(([id,name,price,w,l])=>ALL[id]={id,name,price,w,l});A.forEach(([id,name,price])=>ALL[id]={id,name,price,acc:1});

/* ---------- Иконки (SVG, рисуются по контуру currentColor) ---------- */
const IC={
dice:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>',
store:'<path d="M4 9l1.5-5h13L20 9"/><path d="M4 9v11h16V9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M10 20v-5h4v5"/>',

gem:'<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/><path d="M9 3l3 6 3-6"/><path d="M12 9v12"/>',

crown:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>',

fwd:'<path d="M5 5l7 7-7 7M13 5l7 7-7 7"/>',

headphones:'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><path d="M4 15h3.5v5H5.5A1.5 1.5 0 0 1 4 18.5zM20 15h-3.5v5h2a1.5 1.5 0 0 0 1.5-1.5z"/>',

};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||""}</svg>`;
const CCOL={BTC:["#f7931a","₿"],ETH:["#627eea","Ξ"],TON:["#0098ea","T"]};
const cico=k=>{const c=CCOL[k]||["#888","?"];return `<svg class="cico" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="${c[0]}"/><text x="12" y="16.6" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">${c[1]}</text></svg>`};

/* ---------- Картинки айфонов: рисуем SVG по поколению модели ---------- */
const RC={"":["#8a97b3","#d3dbeb"],rar:["#0284c7","#7dd3fc"],epi:["#7c3aed","#c4b5fd"],leg:["#f59e0b","#fde68a"],myth:["#be123c","#fb7185"],lim:["#ec4899","#fcd34d"]};
const rar=p=>p.l?["lim","Лимитка"]:p.price>=180000?["myth","Мифик"]:p.price>=100000?["leg","Легенда"]:p.price>=40000?["epi","Эпик"]:p.price>=10000?["rar","Редкий"]:["","Обычный"];
const SETS=s=>new Set(s.split(","));
const NOTCH=SETS("x,xr,xs,xsm,11,11p,11pm,12m,12,12p,12pm,13m,13,13p,13pm,14,14pl");
const ISL=SETS("14p,14pm,15,15pl,15p,15pm,16,16pl,16p,16pm,17,17air,17p,17pm,18p,18pm");
const BIG=SETS("6p,6sp,7p,8p,xsm,11pm,12pm,13pm,14pl,14pm,15pl,15pm,16pl,16pm,17pm,18pm");
const MINI=SETS("12m,13m");
const WIDE_NOTCH=SETS("x,xr,xs,xsm,11,11p,11pm");
function spec(id){
 if(NOTCH.has(id))return{k:"n",w:BIG.has(id)?90:MINI.has(id)?76:84,h:188,r:19,tp:5,bt:5,bz:5,nw:WIDE_NOTCH.has(id)?38:id[1]==="2"?32:28};
 if(ISL.has(id))return{k:"i",w:BIG.has(id)?90:id==="17air"?80:84,h:188,r:20,tp:5,bt:5,bz:5};
 if(id==="4"||id==="4s")return{k:"h",w:74,h:150,r:10,tp:22,bt:24,bz:6};
 if(["5","5c","5s","se1"].includes(id))return{k:"h",w:74,h:176,r:12,tp:24,bt:26,bz:6};
 return{k:"h",w:BIG.has(id)?88:80,h:184,r:15,tp:24,bt:26,bz:6};
}
let GID=0;
function phoneSVG(id,c1,c2){
 const g=++GID;
 const f=`url(#f${g})`;
 const defs=`<defs><linearGradient id="f${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient><linearGradient id="w${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c2}"/><stop offset=".55" stop-color="${c1}"/><stop offset="1" stop-color="${c1}" stop-opacity=".85"/></linearGradient><linearGradient id="s${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;
 const unit=(bx,by,w,h,r,tp,bt,bz,k,nw)=>{

 const best=inv.filter(k=>!ALL[k].acc).sort((a,b)=>ALL[b].price-ALL[a].price)[0];
 const me=S.me||{};
 return `<h2>Профиль</h2>${subs}<div class="card"><div class="row" style="border:0;padding:0">${av(me,64)}<div class="n"><div class="big" style="font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(me.name)}</div><div class="mut">${me.un?"@"+esc(me.un):"без username"} · ID ${esc(me.id)}</div></div></div></div><div class="card"><div class="mut">Итого</div><div class="big">${num(total)} ₽</div></div>`+dailyCard()+refCard()+
  `<div class="card">${[["wallet","На руках",S.coins],["bank","В банке",S.bank],["bolt","В крипте",crVal],["box","Вещи (по продаже)",invVal]].map(([i,t,v])=>`<div class="row"><div class="n"><span class="ttl">${ic(i)}${t}</span></div><b>${num(v)} ₽</b></div>`).join("")}</div>`+
  (best?`<div class="card glow" style="--rc:${RC[rar(ALL[best])[0]][0]}"><div class="mut" style="margin-bottom:8px">Самая дорогая вещь</div><div class="row" style="border:0;padding:0">${art(ALL[best])}<div class="n"><b>${ALL[best].name}</b>${tag(ALL[best])}</div></div></div>`:"")+
  `<div class="card"><span class="ttl">${ic("ticket")}Промокод</span><div class="mut" style="margin:2px 0 10px">Введи код и получи бонус. Каждый код работает один раз.</div><input id="promo" placeholder="Код, например SUMMER"><button class="btn" data-a="promo">Активировать</button></div>`+`<div class="card"><span class="ttl">${ic("mega")}Канал игры</span><div class="mut" style="margin:2px 0 10px">Новости, розыгрыши и лимитки первыми.</div><button class="btn" data-a="chan">Открыть t.me/iPhoneNewsGame</button></div>`+(S.admin?`<div class="card"><span class="ttl">${ic("crown")}Админ-панель</span><div class="mut" style="margin:2px 0 10px">У тебя повышенные шансы на эпики, легендарки и мифики.</div>
<b style="font-size:13px">Баланс себе</b><div class="acts" style="margin:6px 0 12px"><button class="btn g" data-a="admset|1000">1к</button><button class="btn g" data-a="admset|50000">50к</button><button class="btn g" data-a="admset|100000">100к</button><button class="btn g" data-a="admset|1000000">1млн</button><button class="btn g" data-a="admset|1000000000">1млрд</button></div><button class="btn" data-a="admduo" style="width:100%;margin-bottom:12px">${ic("flame",16)}Выдать себе iPhone Duo</button>
<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
<b style="font-size:13px">Выдать деньги</b><input id="atg" placeholder="@username или ID"><input id="aam" type="number" min="1" placeholder="Сумма, ₽"><button class="btn" data-a="admgive">Выдать</button>
<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
<b style="font-size:13px">Создать промокод</b><input id="acd" placeholder="Код, например VIP2026"><input id="asm" type="number" min="1" placeholder="Сумма, ₽"><input id="aus" type="number" min="1" placeholder="Сколько раз можно активировать"><input id="ady" type="number" min="0" placeholder="Дней (0 — без срока)"><button class="btn" data-a="admpromo">Создать</button>
<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
<b style="font-size:13px">Промокоды (${(S.promos||[]).length})</b>${(S.promos||[]).map(p=>`<div class="row"><div class="n"><b>${p.code}</b><small>+${num(p.c)} ₽ · осталось ${p.left}${p.exp?" · до "+new Date(p.exp).toLocaleDateString("ru-RU"):" · без срока"}</small></div><button class="btn g" data-a="admpdel|${p.code}">Удалить</button></div>`).join("")||'<span class="mut">Пока нет.</span>'}</div>`:"")
}
};
const TABS=[["find","dice","Крутка"],["shop","store","Магазин"],["inv","box","Вещи"],["bank","bank","Банк"],["market","tag","Авито"]];
$("brand").innerHTML=ic("phone",22)+"Найди айфон";
$("profbtn").innerHTML=ic("user",18);
function render(){
  $("profbtn").innerHTML=S.ready&&S.me?av(S.me,30):ic("user",18);
  $("bal").innerHTML=S.ready?ic("wallet",16)+num(S.coins)+" ₽":"";
  if(S.locked){$("tabs").innerHTML="";$("view").innerHTML=`<div class="card"><h2>Открой через Telegram</h2><p class="mut">Приложение работает только внутри бота. Нажми «Играть» рядом со скрепкой в чате.</p></div>`;return}
  if(!S.ready){$("view").innerHTML=`<p class="mut">Загрузка…</p>`;return}
  $("view").innerHTML=V[S.tab]();
  $("tabs").innerHTML=TABS.map(([k,i,n])=>`<button class="tab ${S.tab===k?"on":""}" data-a="tab|${k}"><span>${ic(i,22)}</span>${n}</button>`).join("")}
let busy=0;
async function api(a,x,y,z,w){
  if(busy)return;busy=1;
  try{
    const r=await fetch("/api",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({initData:TG?TG.initData:"",a,x,y,z,w,t:S.tab})});
    if(r.status===401){S.locked=1}else{
      const d=await r.json();
      if(d.state){Object.assign(S,d.state);S.skew=d.state.now-Date.now();S.ready=1;S.dailyAt=Date.now()+((S.daily&&S.daily.wait)||0)}
      if(d.top)S.top=d.top;if(d.found){S.found=d.found.map(id=>ALL[id]);S.rev={list:S.found,k:0};startReveal()}
      if(a==="sellspin"){S.found=null;S.rev=null}
      if(d.toast)toast(d.toast);
      if(d.invoice){if(TG&&TG.openInvoice)TG.openInvoice(d.invoice,st=>{if(st==="paid"){toast("Оплата прошла");setTimeout(()=>api("state"),1500);setTimeout(()=>api("state"),4500)}else if(st==="failed")toast("Оплата не прошла")});else toast("Открой игру через Telegram")}}
  }catch(e){toast("Нет связи с сервером")}
  busy=0;render()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const[a,x,y]=t.dataset.a.split("|");
  if(a==="skip"){finishReveal();return}
  if(a==="spin"&&S.rev)return;
  if(a==="tab"){S.tab=x;render();api(x==="profile"&&S.psub==="top"?"top":"state")}
  else if(a==="set"){S[x]=y;render();if(x==="psub"&&y==="top")api("top")}
  else if(a==="mult"){S.mult=+x;render()}
  else if(a==="spd"){S.spd=+x;render()}
  else if(a==="mlist")api("mlist",$("msel").value,$("mpr").value);
  else if(a==="chan"){const L="https://t.me/iPhoneNewsGame";TG&&TG.openTelegramLink?TG.openTelegramLink(L):window.open(L,"_blank")}
  else if(a==="promo")api("promo",$("promo").value.trim());
  else if(a==="admgive")api("admgive",$("atg").value.trim(),$("aam").value);
  else if(a==="admpromo")api("admpromo",$("acd").value.trim(),$("asm").value,$("aus").value,$("ady").value);
  else if(a==="pay")api("pay",$("pto").value.trim(),$("pam").value);
  else if(a==="copyref"){const l=S.ref&&S.ref.link;if(l){(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast("Ссылка скопирована")).catch(()=>{const i=document.querySelector("input[readonly]");if(i){i.select();try{document.execCommand("copy");toast("Ссылка скопирована")}catch(e){toast("Выдели и скопируй ссылку")}}})}}
  else if(a==="shareref"){const l=S.ref&&S.ref.link;if(l){const u="https://t.me/share/url?url="+encodeURIComponent(l)+"&text="+encodeURIComponent("Крути айфоны, копи рубли и торгуй в игре «Найди айфон»!");TG&&TG.openTelegramLink?TG.openTelegramLink(u):window.open(u,"_blank")}}
  else api(a,x,y)});
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('gesturechange',e=>e.preventDefault());let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<350&&!e.target.closest('button,input,select,textarea'))e.preventDefault();lt=n},{passive:false});
document.addEventListener("change",e=>{if(e.target.id==="cnt"){const v=Math.floor(+e.target.value);if(v>=1){S.mult=Math.min(500,v);render()}}});
render();api("state");
</script>
</body>
